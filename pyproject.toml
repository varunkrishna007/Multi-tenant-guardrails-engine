[project]
name = "mute-guardrails"
version = "0.1.0"
description = "Mute: multi-tenant guardrails for AI agents, on Gemini Decision 1"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "varunkrishna007" }]
dependencies = [
    "asyncpg>=0.30,<1",
    "cryptography>=44,<50",
    "fastapi>=0.115,<0.120",
    "google-re2>=1.1.20251105",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.45.2,<2",
    "pydantic>=2.7,<3",
    "pyjwt[crypto]>=2.9,!=2.10.0,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "opentelemetry-sdk>=1.45.2,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live and not perf and not slow'"
markers = [
    "live: calls the real Gemini Decisions API; needs GEMINI_API_KEY (run with -m live)",
    "perf: absolute wall-time bounds; run on a quiet machine (run with -m perf)",
    "slow: seeds a large data set and takes minutes (run with -m slow; needs Postgres)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
